spring.application.name=sketch-and-coffee-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sketch_coffee}
# Agregar usuario de MySQL
spring.datasource.username=
# Agregar contraseña de MySQL
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Cambiamos a 'update' temporalmente para permitir que Hibernate
# cree automáticamente las tablas faltantes del modelo relacional
# (categorias, productos, pedidos, detalles_pedido) sin borrar datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true