spring.application.name=sketch-and-coffee-backend

spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}
# Agregar usuario de MySQL
spring.datasource.username=${PROD_DB_USERNAME}
# Agregar contrase�a de MySQL
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${PROD_DDL}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ============================================================
# Imagenes subidas desde el panel de administracion.
# Carpeta FUERA del jar, relativa al directorio de trabajo del
# servicio. En AWS conviene fijarla con PROD_IMAGENES en
# ecommerce.service (el default de systemd es "/" y ahi un usuario
# no abre carpetas); el valor default cubre el dev local.
# ============================================================
app.imagenes.ruta=${PROD_IMAGENES:./imagenes-publicadas}

# Tope de multipart: si Spring Boot 4 renombro la key estos valores
# quedarian inertes y valdria el default de 1 MB por archivo; el
# frontend y el controlador revisan con su propio tope por eso
# siguen siendo consistentes aunque la key no aplique.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB